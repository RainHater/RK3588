--arch=aarch64
--target-os=linux
--cross-prefix=aarch64-linux-gnu-
--prefix=${INSTALL_DIR}
--extra-cflags=-I${INSTALL_DIR}/include
--extra-ldflags=-L${INSTALL_DIR}/lib
--extra-libs=-lm
--enable-version3
--enable-gpl
--enable-nonfree
--enable-libdrm
--enable-shared
--enable-libv4l2
--enable-indev=v4l2
--enable-rkmpp
--enable-rkrga
--disable-debug
--disable-doc
--disable-static