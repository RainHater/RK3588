[cmake]
CMAKE_BUILD_TYPE = Release
SMALL_LOCALSIZE = ON
ENABLE_FAST_MATH = ON
WITH_IPP = OFF
USE_O3 = ON
ENABLE_CXX11 = ON
WITH_TBB = ON
WITH_OPENMP = ON
BUILD_EXAMPLES = OFF
BUILD_DOCS = OFF
WITH_WEBP = OFF
WITH_OPENCL = ON
WITH_OPENGL = OFF
WITH_QT = OFF
WITH_GTK = ON
WITH_GTK_2_X = ON
WITH_CUDA = OFF
BUILD_TESTS = OFF
BUILD_PERF_TESTS = OFF
BUILD_opencv_apps = OFF
BUILD_ZLIB = OFF
WITH_FFMPEG = OFF
OPENCV_FFMPEG_SKIP_BUILD_CHECK = OFF
BUILD_opencv_objdetect = ON
BUILD_opencv_calib3d = ON
BUILD_opencv_dnn = ON
BUILD_opencv_features2d = ON
BUILD_opencv_flann = ON
BUILD_opencv_gapi = OFF
BUILD_opencv_ml = OFF
WITH_GSTREAMER = OFF
WITH_JAVA = OFF
OPENCV_ENABLE_FREE = ON
WITH_JPEG = ON
BUILD_opencv_stitching = OFF
BUILD_opencv_python2 = OFF
BUILD_opencv_python3 = OFF
WITH_FREETYPE = ON
OPENCV_EXTRA_MODULES_PATH = ${THIRD_PARTY_DIR}/opencv_contrib-4.x/modules
CMAKE_INSTALL_PREFIX = ${INSTALL_DIR}
INSTALL_DIR = ${INSTALL_DIR}
